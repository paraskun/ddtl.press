<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Календарь соревнований и воспитательных мероприятий школы конструирования Куборо">
<title>Календарь Куборо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: шапка на «сетке кубиков 5×5 см», переключатель видов, лента карточек мероприятий; детали в модальном окне */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ebe6; --ink:#1d2420; --muted:#5a645d; --line:#d6dbd4;
  --wood:#b98b4e; --wood-soft:#f3e9da;
  --comp:#2a5d8f; --comp-soft:#e1ebf5; --edu:#3c7848; --edu-soft:#e2efe4;
  --gold:#a8790c; --silver:#6e7a84; --bronze:#9a5a2c; --danger:#b23b2e;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131714; --surface:#1b201c; --sunk:#232924; --ink:#e6ebe5; --muted:#9ba59c; --line:#2e3530;
  --wood:#d6b07a; --wood-soft:#2c251b;
  --comp:#82b3e3; --comp-soft:#1b2a38; --edu:#8cc597; --edu-soft:#1d2d21;
  --gold:#e0b44a; --silver:#a9b4bd; --bronze:#d38f5e; --danger:#e57a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1b201c; --sunk:#232924; --ink:#e6ebe5; --muted:#9ba59c; --line:#2e3530;
  --wood:#d6b07a; --wood-soft:#2c251b;
  --comp:#82b3e3; --comp-soft:#1b2a38; --edu:#8cc597; --edu-soft:#1d2d21;
  --gold:#e0b44a; --silver:#a9b4bd; --bronze:#d38f5e; --danger:#e57a6c; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--comp);outline-offset:2px}

/* Шапка */
.top{border-bottom:1px solid var(--line);background:
  repeating-linear-gradient(0deg,transparent 0 47px,var(--line) 47px 48px),
  repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px);
  background-color:var(--bg)}
.top .wrap{padding-block:28px 20px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.4vw,32px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.next strong{font-weight:600}
.next .cd{font-family:var(--f-mono);font-size:13px;color:var(--wood);margin-left:auto}

/* Панель инструментов */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px 6px}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.spacer{flex:1}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.teach{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.teach input{accent-color:var(--wood);width:16px;height:16px}

.banner{margin-top:14px;border:1px dashed var(--wood);background:var(--wood-soft);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner b{font-weight:600}

main.wrap{padding-block:8px 60px}
.sec-h{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

/* Карточки */
.list{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:74px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.ev:hover{border-color:var(--muted)}
.ev-date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;padding:8px 4px;background:var(--sunk);font-variant-numeric:tabular-nums;align-self:start}
.ev.comp .ev-date{background:var(--comp-soft);color:var(--comp)}
.ev.edu .ev-date{background:var(--edu-soft);color:var(--edu)}
.ev-date .d{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.ev-date .m{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.ev-date .w{font-size:11px;opacity:.8}
.ev-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.ev-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev h3{margin:0;font-size:17px;font-weight:600;line-height:1.3;text-wrap:balance}
.meta{margin:0;color:var(--muted);font-size:14px}
.kids{margin:2px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kid{background:var(--sunk);border-radius:6px;padding:1px 8px;font-size:13px}
.kid.mine{background:var(--wood-soft);outline:1px solid var(--wood)}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.pill.comp{background:var(--comp-soft);color:var(--comp)}
.pill.edu{background:var(--edu-soft);color:var(--edu)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:1px 7px 1px 5px;background:var(--surface);white-space:nowrap}
.lvl .bars{display:inline-flex;align-items:flex-end;gap:1px;height:10px}
.lvl .bars i{width:2px;border-radius:1px;background:var(--line)}
.lvl .bars i.on{background:var(--wood)}
.lvl.hi{border-color:var(--wood)}
.st{font-size:12px;color:var(--muted)}
.st.open{color:var(--edu);font-weight:600}
.st.soon{color:var(--wood);font-weight:600}

.tabs{max-width:100%;overflow-x:auto}
@media (max-width:440px){.tabs button{padding:7px 10px}}
/* Команды */
.tip{position:relative;cursor:help;outline:none}
.tip .pop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:180px;max-width:260px;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:400;line-height:1.35;box-shadow:0 8px 24px rgb(0 0 0/.25);white-space:normal;text-align:left;letter-spacing:0;text-transform:none}
.tip .pop b{font-weight:600}
.tip .pop .pl{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tip .pop .pl .me{font-weight:700;text-decoration:underline}
.tip:hover .pop,.tip:focus .pop,.tip:focus-within .pop{display:block}
.tm.mine{outline:1px solid var(--wood)}
.tm .tip{display:inline-flex;gap:5px;align-items:baseline}
.tm{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;background:var(--wood-soft);border-radius:6px;padding:1px 8px;max-width:100%;min-width:0;position:relative}
.tm b{font-weight:600;white-space:nowrap}
.tm>.tip>span:not(.pop){color:var(--muted);white-space:nowrap}
.ppl li.tmh{background:var(--wood-soft);font-weight:600;gap:8px}
.ppl li.tmh .tag,.tcard .tag{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--surface)}
.ppl li.tmh .res{margin-left:auto}
.ppl li.inteam{padding-left:24px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard h3{margin:0;font-size:17px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tcard .who{display:flex;flex-wrap:wrap;gap:4px}
.tcard .evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.tcard .evs li{display:flex;gap:8px;align-items:baseline;min-width:0}
.tcard .evs .dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.tcard .evs button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;min-width:0}
.tcard .evs .medal{width:18px;height:18px;font-size:10px}

/* Результаты и фото в архиве */
.podium{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.place{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 3px;background:var(--surface)}
.medal{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:#fff;flex:none}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.mP{background:var(--muted)}
.thumbs{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none}

/* Календарь */
.cal-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.cal-head h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 auto 0 0;text-transform:capitalize}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:6px 0;font-weight:600}
.cell{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:var(--bg)}
.cell .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cell.today .n{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;align-self:flex-start}
.cell.wknd .n{color:var(--wood)}
.cell.today.wknd .n{color:var(--bg)}
.cev{border:0;text-align:left;font-size:12px;line-height:1.25;padding:3px 6px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.cev.comp{background:var(--comp-soft);color:var(--comp);border-left:3px solid var(--comp)}
.cev.edu{background:var(--edu-soft);color:var(--edu);border-left:3px solid var(--edu)}
.cev.past{opacity:.6}
@media (max-width:640px){
  .cell{min-height:58px;padding:4px}
  .cev{font-size:0;padding:0;height:8px;border-radius:3px;border-left:0}
  .cev.comp{background:var(--comp)}.cev.edu{background:var(--edu)}
  .ev{grid-template-columns:60px minmax(0,1fr);gap:12px;padding:12px}
  .ev-date .d{font-size:22px}
}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--ink);margin:0;font-size:17px}
.empty p{margin:0;max-width:52ch}

/* Модальное окно */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgb(0 0 0/.3)}
dialog::backdrop{background:rgb(10 14 12/.5)}
.mh{position:sticky;top:0;background:var(--surface);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;z-index:1}
.mh h2{margin:4px 0 0;font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.25;text-wrap:balance}
.mh .x{margin-left:auto;flex:none}
.mb{padding:16px 20px 22px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.desc{margin:0;white-space:pre-wrap}
.blk h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ppl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.ppl li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ppl li:first-child{border-top:0}
.ppl .nm{font-weight:500}
.ppl .gr{color:var(--muted);font-size:13px}
.ppl .note{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.ppl .rm{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.ppl .res{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ppl .res select,.ppl .res input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);font-size:13px}
.ppl .res input{width:150px}
.signup{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:8px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:15px;width:100%;box-sizing:border-box}
.fld textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;max-width:100%}
.photos .del{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgb(0 0 0/.6);color:#fff;font-size:12px;padding:2px 6px;cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<style>
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--bg)}
.foot{color:var(--muted);font-size:13px;padding-block:0 40px;display:flex;flex-wrap:wrap;gap:6px 16px}
.foot a{color:inherit}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.crumbs a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{color:var(--ink);border-color:var(--ink)}
</style>

<header class="top">
  <div class="wrap">
    <nav class="crumbs" aria-label="Навигация"><a href="/cuboro/">Школа Куборо</a><span aria-hidden="true">/</span><span>Календарь</span></nav>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="2" y="2" width="40" height="40" rx="5" fill="var(--wood-soft)" stroke="var(--wood)" stroke-width="2"/>
        <path d="M2 22 H14 A8 8 0 0 0 22 14 V2" fill="none" stroke="var(--wood)" stroke-width="5"/>
        <circle cx="30" cy="30" r="5" fill="var(--comp)"/>
      </svg>
      <div>
        <h1>Календарь Куборо</h1>
        <p id="school">Соревнования и воспитательные мероприятия школы конструирования</p>
      </div>
    </div>
    <div id="next"></div>
    <div id="banner"></div>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="tabs" role="group" aria-label="Вид">
      <button data-act="view" data-v="list">Ближайшие</button>
      <button data-act="view" data-v="cal">Календарь</button>
      <button data-act="view" data-v="arch">Архив</button>
      <button data-act="view" data-v="teams">Команды</button>
    </div>
    <div class="chips" role="group" aria-label="Тип">
      <button class="chip" data-act="filter" data-v="all">Все</button>
      <button class="chip" data-act="filter" data-v="comp"><i style="background:var(--comp)"></i>Соревнования</button>
      <button class="chip" data-act="filter" data-v="edu"><i style="background:var(--edu)"></i>Воспитательные</button>
    </div>
    <span class="spacer"></span>
    <select id="lvlSel" class="sel" aria-label="Уровень мероприятия" hidden></select>
    <select id="childSel" class="sel" aria-label="Показать мероприятия ребёнка"></select>
    <button class="btn ghost" data-act="reload" id="reloadBtn">Обновить</button>
  </div>
  <div id="content"><div class="empty"><p>Загружаем календарь…</p></div></div>
</main>
<footer class="wrap foot"><span id="stamp"></span></footer>

<dialog id="dlg"><div id="dlgIn"></div></dialog>
<div id="toast" class="toast" hidden></div>

<script>
/* ================== НАСТРОЙКИ ==================
   1. В Google Таблице: Файл → Поделиться → Опубликовать в интернете.
      Выберите лист «Мероприятия», формат CSV, скопируйте ссылку в eventsCsv.
      Повторите для листа «Участники» → participantsCsv.
   2. formUrl — ссылка на Google Форму записи (кнопка «Записать ребёнка»).
   3. formEventEntry — необязательно: код поля «Мероприятие» из предзаполненной
      ссылки формы (вида entry.123456789), чтобы форма открывалась уже
      с выбранным мероприятием.
   Пока eventsCsv пуст, страница показывает пример. */
const CONFIG = {
  eventsCsv: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTReeLJKdmnmwpYzaVPddogzBjS_M8oQ0Ls_O29YEXD1NRIrlmsAoFdvjm8hM18etWAmrjIVezQetXz/pub?gid=0&single=true&output=csv',
  participantsCsv: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTReeLJKdmnmwpYzaVPddogzBjS_M8oQ0Ls_O29YEXD1NRIrlmsAoFdvjm8hM18etWAmrjIVezQetXz/pub?gid=1584697008&single=true&output=csv',
  teamsCsv: '',

/* ---------- Чтение таблицы ---------- */
function parseCsv(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[_\s]+/g,' ').trim();
function table(text,aliases){
  const rows=parseCsv(text);if(!rows.length)return [];
  const head=rows[0].map(norm);
  const idx={};for(const [key,names] of Object.entries(aliases)){idx[key]=head.findIndex(h=>names.some(n=>h===n||h.startsWith(n)))}
  return rows.slice(1).map(r=>{const o={};for(const k in idx)o[k]=idx[k]>=0?(r[idx[k]]||'').trim():'';return o});
}
function toDate(s){
  s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))return `${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;
  return '';
}
const toTime=s=>{const m=String(s||'').match(/(\d{1,2}):(\d{2})/);return m?`${pad(m[1])}:${m[2]}`:''};
function toPlace(s){const n=norm(s);if(!n)return '';const d=n.match(/^([123])\b/);if(d)return d[1];if(n.includes('не приш')||n.includes('отсутств'))return 'A';if(n.includes('участ')||n==='+'||n==='да')return 'P';return ''}
const LEVELS=['Учрежденческий','Районный','Городской','Региональный','Межрегиональный','Всероссийский','Международный'];
function toLevel(s){const n=norm(s);if(!n)return 0;const keys=['учрежд','район','город','регион','межрег','всерос','междун'];
  if(n.startsWith('межрег'))return 5;if(n.startsWith('междун'))return 7;const i=keys.findIndex(k=>n.startsWith(k));return i<0?0:i+1}
function lvlTag(e){if(!e.level)return '';const L=LEVELS[e.level-1];
  return `<span class="lvl ${e.level>=4?'hi':''}" title="Уровень: ${L.toLowerCase()}"><span class="bars" aria-hidden="true">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=e.level?'on':''}" style="height:${3+i}px"></i>`).join('')}</span>${L}</span>`}
function photoLinks(s){
  return String(s||'').split(/[\s,]+/).filter(u=>/^https?:\/\//.test(u)).map(u=>{
    const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    return m?`https://lh3.googleusercontent.com/d/${m[1]}=w800`:u});
}
function build(evRows,ppRows,tmRows){
  const events=evRows.map((r,i)=>({id:r.id||('row'+(i+2)),title:r.title,type:norm(r.type).includes('сорев')?'comp':'edu',level:toLevel(r.level),
    date:toDate(r.date),time:toTime(r.time),place:r.place,deadline:toDate(r.deadline),desc:r.desc,photos:photoLinks(r.photos)}))
    .filter(e=>e.title&&e.date);
  const kids=[];
  const splitNames=v=>String(v||'').split(',').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  for(const r of ppRows){
    const key=norm(r.event);if(!key)continue;
    const ev=events.find(e=>norm(e.id)===key)||events.find(e=>norm(e.title)===key);if(!ev)continue;
    const team=(r.team||'').trim();
    const names=r.child?[r.child.replace(/\s+/g,' ').trim()]:(team?splitNames(r.members):[]);
    for(const name of names){
      if(kids.some(k=>k.eventId===ev.id&&norm(k.name)===norm(name)))continue;
      kids.push({eventId:ev.id,name,group:r.child?r.group:'',team,place:toPlace(r.result),note:r.note,viaTeam:!r.child});
    }
  }
  const perm=(tmRows&&tmRows.length)?tmRows:[];
  for(const r of ppRows){const t=(r.team||'').trim();if(t&&r.members&&!perm.some(x=>norm(x.name)===norm(t)))perm.push({name:t,group:'',m1:'',m2:'',m3:'',list:splitNames(r.members)})}
  return {events,kids,teams:buildTeams(kids,perm)};
}
const EV_ALIASES={id:['id','код'],type:['тип'],level:['уровень'],title:['название','мероприятие'],date:['дата'],time:['время','начало'],place:['место'],deadline:['запись до','прием заявок до','дедлайн'],desc:['описание'],photos:['фото']};
function buildTeams(kids,tmRows){
  const teams=[];
  for(const r of tmRows){const name=(r.name||'').trim();if(!name||teams.some(t=>norm(t.name)===norm(name)))continue;
    teams.push({name,group:r.group||'',members:(r.list||[r.m1,r.m2,r.m3]).map(x=>(x||'').trim()).filter(Boolean),permanent:true})}
  for(const k of kids){if(!k.team)continue;let t=teams.find(t=>norm(t.name)===norm(k.team));
    if(!t){t={name:k.team,group:'',members:[],permanent:false};teams.push(t)}
    if(!t.permanent&&!t.members.some(m=>norm(m)===norm(k.name)))t.members.push(k.name)}
  return teams;
}
const TM_ALIASES={name:['команда'],group:['группа'],m1:['участник 1'],m2:['участник 2'],m3:['участник 3']};
const PP_ALIASES={members:['состав команды'],team:['команда'],event:['мероприятие'],child:['ребенок','имя','участник','фамилия'],group:['группа'],result:['результат','место'],note:['комментарий','примечание']};

async function fetchText(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.text()}
async function load(manual){
  if(!CONFIG.eventsCsv){S.mode='demo';S.data=makeDemo();render();return}
  if(manual){$('#reloadBtn').disabled=true}
  try{
    const [ev,pp,tm]=await Promise.all([fetchText(CONFIG.eventsCsv),CONFIG.participantsCsv?fetchText(CONFIG.participantsCsv):Promise.resolve(''),
      CONFIG.teamsCsv?fetchText(CONFIG.teamsCsv).catch(()=>''):Promise.resolve('')]);
    if(/^\s*<!doctype|^\s*<html/i.test(ev))throw new Error('html');
    const tmOk=tm&&!/^\s*<!doctype|^\s*<html/i.test(tm);
    S.data=build(table(ev,EV_ALIASES),pp?table(pp,PP_ALIASES):[],tmOk?table(tm,TM_ALIASES):[]);
    S.mode='live';S.error='';S.loadedAt=new Date();
    lsSet('cb.cache',JSON.stringify({at:S.loadedAt.toISOString(),data:S.data}));
    if(manual)toast('Календарь обновлён');
  }catch(e){
    const c=lsGet('cb.cache');
    if(c&&S.mode!=='live'){try{const o=JSON.parse(c);S.data=o.data;S.loadedAt=new Date(o.at);S.mode='live'}catch{}}
    S.error=S.mode==='live'?'Не удалось обновить: показаны данные с прошлого раза.':'Не удалось загрузить таблицу. Проверьте, что листы опубликованы в интернете в формате CSV.';
    if(S.mode!=='live')S.mode='error';
  }
  $('#reloadBtn').disabled=false;render();refreshModal();
}

function podium(e){
  const ks=kidsFor(e.id);const top=ks.filter(k=>['1','2','3'].includes(k.place)).sort((a,b)=>a.place.localeCompare(b.place));
  const seen=new Set(),items=[];for(const k of top){const key=k.team?'t:'+norm(k.team)+k.place:'k:'+k.name;if(seen.has(key))continue;seen.add(key);items.push({place:k.place,team:k.team,label:k.team?'«'+k.team+'»':k.name})}
  let h=items.length?`<div class="podium">${items.map(k=>`<span class="place"><span class="medal m${k.place}">${k.place}</span>${k.team?teamTip(k.team,ks.filter(x=>norm(x.team||'')===norm(k.team)).map(x=>x.name),esc(k.label)):esc(k.label)}</span>`).join('')}</div>`:`<div class="kids">${kidChips(e)}</div>`;
  if(e.photos.length)h+=`<div class="thumbs">${e.photos.slice(0,6).map(p=>`<img src="${esc(p)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div>`;
  return h;
}
function renderArch(){
  const past=visible().filter(isPast).reverse();
  if(!past.length)return '<div class="empty"><h3>Архив пока пуст</h3><p>Прошедшие мероприятия с результатами и фото будут собираться здесь.</p></div>';
  return `<h2 class="sec-h">Прошедшие мероприятия</h2><div class="list">${past.map(e=>card(e,podium(e))).join('')}</div>`;
}
function renderTeams(){
  let ts=(S.data.teams||[]).slice();
  if(S.child)ts=ts.filter(t=>t.members.some(m=>norm(m)===norm(S.child)));
  if(!ts.length)return `<div class="empty"><h3>${S.child?'Ребёнок пока не состоит в команде':'Команд пока нет'}</h3><p>Здесь появятся команды и их состав, как только педагог укажет команды в таблице.</p></div>`;
  ts.sort((a,b)=>(b.permanent-a.permanent)||a.name.localeCompare(b.name,'ru'));
  const card=t=>{const evIds=[...new Set(S.data.kids.filter(k=>k.team&&norm(k.team)===norm(t.name)).map(k=>k.eventId))];
    const evs=sortEv(S.data.events.filter(e=>evIds.includes(e.id))).reverse();
    const best=e=>{const ps=S.data.kids.filter(k=>k.eventId===e.id&&norm(k.team||'')===norm(t.name)).map(k=>k.place).filter(p=>['1','2','3'].includes(p)).sort();return ps[0]||''};
    return `<div class="tcard"><h3>${esc(t.name)}${t.permanent?'<span class="tag">постоянная</span>':''}${t.group?`<span class="tag">${esc(t.group)}</span>`:''}</h3>
      <div class="who">${t.members.map(m=>`<span class="kid ${isMine(m)?'mine':''}">${esc(m)}</span>`).join('')||'<span class="st">Состав не указан</span>'}</div>
      ${evs.length?`<ul class="evs">${evs.map(e=>{const b=best(e);return `<li><span class="dt">${parse(e.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</span>${b?`<span class="medal m${b}">${b}</span>`:''}<button data-open="${esc(e.id)}">${esc(e.title)}</button></li>`}).join('')}</ul>`:'<span class="st">Пока не участвовала в мероприятиях</span>'}</div>`};
  const perm=ts.filter(t=>t.permanent),other=ts.filter(t=>!t.permanent);
  return (perm.length?`<h2 class="sec-h">Постоянные команды</h2><div class="teams">${perm.map(card).join('')}</div>`:'')
    +(other.length?`<h2 class="sec-h">${perm.length?'Команды на отдельных мероприятиях':'Команды'}</h2><div class="teams">${other.map(card).join('')}</div>`:'');
}
function renderCal(){
  const [y,m]=S.month;const first=new Date(y,m,1);const start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();
  const ev=visible();const by={};ev.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e)});
  let cells='';const total=Math.ceil((start+days)/7)*7;
  for(let i=0;i<total;i++){const d=new Date(y,m,i-start+1),k=ymd(d),wk=d.getDay()===0||d.getDay()===6;
    cells+=`<div class="cell ${d.getMonth()!==m?'out':''} ${k===TODAY?'today':''} ${wk?'wknd':''}"><span class="n">${d.getDate()}</span>${(by[k]||[]).map(e=>`<button class="cev ${e.type} ${isPast(e)?'past':''}" data-open="${esc(e.id)}" title="${esc(e.title)}" aria-label="${esc(e.title)}">${esc(e.title)}</button>`).join('')}</div>`}
  const mev=ev.filter(e=>e.date.startsWith(`${y}-${pad(m+1)}`));
  return `<div class="cal-head"><h2>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2>
    <button class="btn ghost" data-act="today">Сегодня</button><button class="ibtn" data-act="prev" aria-label="Предыдущий месяц">‹</button><button class="ibtn" data-act="next" aria-label="Следующий месяц">›</button></div>
    <div style="overflow-x:auto"><div class="grid">${['пн','вт','ср','чт','пт','сб','вс'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>
    <h2 class="sec-h">В этом месяце</h2>${mev.length?`<div class="list">${mev.map(e=>card(e,isPast(e)?podium(e):'')).join('')}</div>`:'<div class="empty"><p>В этом месяце мероприятий нет.</p></div>'}`;
}

/* ---------- Карточка мероприятия ---------- */
const dlg=$('#dlg');
function openEvent(id){S.modal=id;drawModal();if(!dlg.open)dlg.showModal()}
function closeModal(){S.modal=null;if(dlg.open)dlg.close()}
dlg.addEventListener('close',()=>{S.modal=null});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeModal()});
function refreshModal(){if(S.modal)drawModal()}
function drawModal(){
  const e=S.data.events.find(x=>x.id===S.modal);
  if(!e){$('#dlgIn').innerHTML='<div class="mh"><h2>Мероприятие не найдено</h2><button class="btn ghost x" data-act="close">Закрыть</button></div>';return}
  const ks=kidsFor(e.id),past=isPast(e),st=status(e);
  const placeHtml=(pl,note)=>pl||note?`<span class="res">${pl?(['1','2','3'].includes(pl)?`<span class="place"><span class="medal m${pl}">${pl}</span>${PLACES[pl]}</span>`:`<span class="st">${PLACES[pl]}</span>`):''}${note?`<span class="note">${esc(note)}</span>`:''}</span>`:'';
  const row=(k,inTeam,hideRes)=>`<li class="${inTeam?'inteam':''}"><span class="nm">${isMine(k.name)?'<u>'+esc(k.name)+'</u>':esc(k.name)}</span><span class="gr">${esc(k.group||'')}</span>${hideRes?(k.note?placeHtml('',k.note):''):placeHtml(k.place,k.note)}</li>`;
  const {g:tg,solo}=teamGroups(ks);
  const ppl=ks.length?`<ul class="ppl">${tg.map(t=>{const ti=teamInfo(t.name);const pls=[...new Set(t.kids.map(k=>k.place))];const same=pls.length===1&&pls[0];
      const missing=ti&&ti.permanent?ti.members.filter(m=>!t.kids.some(k=>norm(k.name)===norm(m))):[];
      return `<li class="tmh"><span>Команда «${teamTip(t.name,t.kids.map(k=>k.name))}»</span>${ti&&ti.permanent?'<span class="tag">постоянная</span>':''}${same?placeHtml(same,''):''}</li>`+t.kids.map(k=>row(k,true,same)).join('')+(missing.length?`<li class="inteam"><span class="st">Также в команде: ${esc(missing.join(', '))}</span></li>`:'')}).join('')
    +(tg.length&&solo.length?'<li class="tmh"><span>Личный зачёт</span></li>':'')+solo.map(k=>row(k,!!tg.length,false)).join('')}</ul>`:'<p class="hint">Пока никто не записан.</p>';
  const link=formLink(e);
  const signup=canSign(e)?`<div class="signup">${link?`<div class="acts"><a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">Записать ребёнка</a></div>
    <p class="hint">Откроется форма записи. Укажите имя и первую букву фамилии: список видят все родители. Ребёнок появится в списке в течение нескольких минут.</p>`:'<p class="hint">Чтобы записать ребёнка, напишите педагогу.</p>'}</div>`:'';
  const photos=e.photos.length?`<div class="blk"><h4><span>Фото</span></h4><div class="photos">${e.photos.map(p=>`<figure><a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="Фото с мероприятия" loading="lazy" referrerpolicy="no-referrer"></a></figure>`).join('')}</div></div>`:'';
  $('#dlgIn').innerHTML=`<div class="mh"><div><div class="ev-top"><span class="pill ${e.type}">${TYPE[e.type]}</span>${lvlTag(e)}<span class="st ${st.cls}">${st.text}</span></div><h2>${esc(e.title)}</h2></div><button class="btn ghost x" data-act="close" aria-label="Закрыть">✕</button></div>
  <div class="mb">
    <dl class="facts">${e.level?`<dt>Уровень</dt><dd>${LEVELS[e.level-1]}</dd>`:''}<dt>Когда</dt><dd>${fmtLong(e.date)}${e.time?', '+esc(e.time):''}</dd>${e.place?`<dt>Где</dt><dd>${esc(e.place)}</dd>`:''}${e.deadline?`<dt>Запись</dt><dd>до ${fmtShort(e.deadline)}</dd>`:''}</dl>
    ${e.desc?`<p class="desc">${esc(e.desc)}</p>`:''}
    <div class="blk"><h4><span>${past?'Участники и результаты':'Записаны'}</span><span>${ks.length}</span></h4>${ppl}</div>
    ${signup}${photos}
  </div>`;
}

/* ---------- События ---------- */
document.addEventListener('click',ev=>{
  if(ev.target.closest('.tip')&&ev.target.closest('[data-open]'))return;
  const t=ev.target.closest('[data-act],[data-open]');if(!t)return;
  if(t.dataset.open){openEvent(t.dataset.open);return}
  const a=t.dataset.act;
  if(a==='view'){S.view=t.dataset.v;lsSet('cb.view',S.view);render()}
  else if(a==='filter'){S.filter=t.dataset.v;render()}
  else if(a==='prev'||a==='next'){let [y,m]=S.month;m+=a==='next'?1:-1;if(m<0){m=11;y--}if(m>11){m=0;y++}S.month=[y,m];render()}
  else if(a==='today'){const d=new Date();S.month=[d.getFullYear(),d.getMonth()];render()}
  else if(a==='reload')load(true);
  else if(a==='close')closeModal();
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('article[data-open]')){ev.preventDefault();openEvent(ev.target.dataset.open)}});
document.addEventListener('change',ev=>{if(ev.target.id==='lvlSel'){S.level=+ev.target.value;render();return}if(ev.target.id==='childSel'){S.child=ev.target.value;lsSet('cb.child',S.child);render()}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

load(false);
setInterval(()=>{if(document.visibilityState==='visible'&&S.mode==='live')load(false)},5*60*1000);
</script>
